name: CI + Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Lint + test
        run: npm run lint && npm test

      - name: Build
        run: npm run build

  deploy:
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: Dev
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Debug DATABASE_URL host
        run: |
          echo "${DATABASE_URL}" | sed 's#://.*@#://***@#'

      - name: Test Supabase connectivity
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          PGPASSWORD=$(node -e "console.log(new URL(process.env.DATABASE_URL).password)") \
          psql "$DATABASE_URL" -c 'select version();'

      - name: Apply Prisma migrations to Supabase
        run: npx prisma migrate deploy

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v20.0.1
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: .
