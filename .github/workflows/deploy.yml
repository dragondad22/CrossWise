# Production deploys (#139, dark-factory decisions 18 and 22). Only a v* tag deploys, once: merges to
# main deploy nothing, and Vercel's own deploys from main are off (vercel.json). Chris tags a release
# after approving it (CLAUDE.md, "Releases"). The deploy secrets live only
# in the Production environment, which only v* tags may use.
#
# In order: the migrations production hasn't applied (scripts/release-plan.sh), the deployment to
# fall back to, a database snapshot if there are pending migrations, migrate, deploy, smoke test.
# If anything fails after the deploy, the previous deployment comes back, but only when the release
# is expand-only: old code can't undo a schema change. Any failure opens an issue for Chris, saying
# which deployment production serves. Vercel is driven through scripts/vercel.sh, its REST API (#149).

name: Deploy

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  issues: write   # the failure issue, and nothing else

jobs:
  release:
    runs-on: ubuntu-latest
    environment: Production
    # One release at a time. A newer tag waiting here replaces an older one that hasn't started:
    # tags are cut from main, so the newer one holds the older one's changes, and the plan counts
    # every migration production hasn't applied.
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      PRODUCTION_URL: https://crosswise.buildyouralpaca.com
      VERCEL_CLI: vercel@63.1.2
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: What the release does to the database
        id: plan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c \
            'SELECT migration_name FROM _prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL' |
            bash scripts/release-plan.sh >>"$GITHUB_OUTPUT"

      - name: Note the deployment to fall back to
        id: previous
        run: |
          id=$(bash scripts/vercel.sh serving)
          echo "id=$id" >>"$GITHUB_OUTPUT"

      # A Neon branch of production (the project's default branch), with no compute: a way back from
      # a bad migration. Neon's free plan keeps 10 branches; delete old snapshots in the Neon console.
      - name: Snapshot the database
        id: snapshot
        if: steps.plan.outputs.pending != ''
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NAME: release-${{ github.ref_name }}-${{ github.run_attempt }}
        run: |
          branch=$(curl -fsS -X POST "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches" \
            -H "Authorization: Bearer $NEON_API_KEY" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg name "$NAME" '{branch: {name: $name}}')" | jq -r '"\(.branch.name) (\(.branch.id))"')
          echo "branch=$branch" >>"$GITHUB_OUTPUT"

      - name: Migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      # Built as a production deployment that no domain points at yet. Promoting it moves the domain,
      # and turns the domain's automatic moves back on after a rollback.
      - name: Deploy
        id: deploy
        run: |
          url=$(npx --yes "$VERCEL_CLI" deploy --prod --skip-domain --yes --token "$VERCEL_TOKEN")
          echo "url=$url" >>"$GITHUB_OUTPUT"
          id=$(bash scripts/vercel.sh id "$url")
          echo "id=$id" >>"$GITHUB_OUTPUT"

      - name: Promote
        env:
          DEPLOYMENT: ${{ steps.deploy.outputs.id }}
        run: bash scripts/vercel.sh promote "$DEPLOYMENT"

      - name: Smoke test
        run: bash scripts/smoke.sh "$PRODUCTION_URL"

      - name: Roll back
        id: rollback
        if: failure() && steps.deploy.outputs.id != '' && steps.plan.outputs.expand_only == 'true'
        env:
          PREVIOUS: ${{ steps.previous.outputs.id }}
        run: |
          if [ "$(bash scripts/vercel.sh serving)" = "$PREVIOUS" ]; then
            echo "Production already serves $PREVIOUS: nothing to roll back."
            echo "did=nothing" >>"$GITHUB_OUTPUT"
          else
            bash scripts/vercel.sh rollback "$PREVIOUS"
            echo "did=rolled-back" >>"$GITHUB_OUTPUT"
          fi

      - name: Tell Chris
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PENDING: ${{ steps.plan.outputs.pending }}
          EXPAND_ONLY: ${{ steps.plan.outputs.expand_only }}
          PREVIOUS: ${{ steps.previous.outputs.id }}
          SNAPSHOT: ${{ steps.snapshot.outputs.branch }}
          DEPLOYED: ${{ steps.deploy.outputs.id }}
          ROLLBACK: ${{ steps.rollback.outputs.did }}
        run: |
          # Asked of Vercel now, not worked out from which steps ran.
          serving=$(bash scripts/vercel.sh serving 2>/dev/null || echo unknown)
          if [ -n "$PREVIOUS" ] && [ "$serving" = "$PREVIOUS" ]; then
            state="Production still serves the deployment from before this release ($PREVIOUS)."
            [ "$ROLLBACK" = rolled-back ] && state="$state It was rolled back to it."
            [ -n "$PENDING" ] && [ "$EXPAND_ONLY" != true ] &&
              state="$state But the release's migrations may have run, and they aren't expand-only: check the old code works on the new schema."
          elif [ -n "$DEPLOYED" ] && [ "$serving" = "$DEPLOYED" ]; then
            if [ "$EXPAND_ONLY" != true ]; then
              state="Production serves this release ($DEPLOYED), which failed its checks. It wasn't rolled back: its migrations aren't expand-only, so old code may not run on the new schema. Fix forward, or restore the snapshot and roll back by hand."
            else
              state="Production serves this release ($DEPLOYED), which failed its checks, and rolling back to $PREVIOUS failed. Roll back by hand in Vercel."
            fi
          else
            state="Production serves $serving, which is neither the deployment from before nor this release. Check Vercel by hand."
          fi
          {
            echo "$state"
            echo
            echo "- Run: $RUN"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Migrations production hadn't applied: ${PENDING:-none} (expand-only: ${EXPAND_ONLY:-unknown})"
            echo "- Snapshot: ${SNAPSHOT:-none taken}"
            echo "- Deployment before this release: ${PREVIOUS:-unknown}"
            echo "- This release's deployment: ${DEPLOYED:-none}"
          } >body.md
          cat body.md >>"$GITHUB_STEP_SUMMARY"
          gh issue create -R "$GITHUB_REPOSITORY" --title "Release $GITHUB_REF_NAME failed" \
            --label priority:critical --label area:infra --body-file body.md
