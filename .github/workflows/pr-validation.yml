# PR validation (#138): runs scripts/ci.sh, the same script the dark factory runs in its box.
# It holds no secrets and can't write to the repo, so a branch's own copy of this file can do no
# harm before review. Migrations are applied to the Postgres service below, a database that lives
# only as long as the job. Deploys live in deploy.yml.

name: PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci   # this job's throwaway database, not a secret
          POSTGRES_DB: crosswise
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/crosswise
      CI_BASE: HEAD^1   # the PR's merge commit; its first parent is main

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # the merge commit and its parents, for CI_BASE
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: bash scripts/ci.sh

      # --- Failure diagnostics -------------------------------------------------
      # Success is silent. On failure, upload whatever diagnostics the checks
      # wrote so the failure can be fixed without re-running it.
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics
          path: |
            testing-reports/
            test-results/
          if-no-files-found: ignore
